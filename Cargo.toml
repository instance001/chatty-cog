[package]
name = "chattycog_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
eframe = { version = "0.30", default-features = true, features = ["wgpu"] }
libloading = "0.8"
module_host_support = { path = "module_host_support" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
url = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
] }
wry = "0.55"

[build-dependencies]
bindgen = "0.71"
